    <circle cx="160" cy="316.35" r="2.5"/>
    <circle cx="190" cy="309.15" r="2.5"/>
    <circle cx="220" cy="302.85" r="2.5"/>
    <circle cx="250" cy="296.1" r="2.5"/>
    <circle cx="280" cy="289.8" r="2.5"/>
    <circle cx="310" cy="283.5" r="2.5"/>
    <circle cx="340" cy="277.65" r="2.5"/>
    <circle cx="370" cy="271.35" r="2.5"/>
