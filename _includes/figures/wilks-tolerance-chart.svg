<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; display: block; margin: 1.2em auto 2em;" role="img" aria-label="Line chart showing required sample size n as a function of order statistic k for different confidence and coverage levels">
  <style>
    .chart-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: var(--text); }
    .chart-axis { stroke: var(--text); stroke-width: 1.5; fill: none; }
    .chart-grid { stroke: var(--border); stroke-width: 1; fill: none; }
    .chart-line { fill: none; stroke: var(--text); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .chart-line-dashed { stroke-dasharray: 8, 6; }
    .chart-line-dotted { stroke-dasharray: 2, 5; }
    .chart-dot { fill: var(--bg); stroke: var(--text); stroke-width: 1.8; }
    .chart-title { font-size: 13px; font-weight: 600; fill: var(--text); }
    .chart-legend { font-size: 11px; fill: var(--text); }
  </style>

  <!-- Grid -->
